[workspace]
members = [
    "crates/libraw-rs",
    "crates/codec",
    "crates/darkroom",
    "crates/terminalroom",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
codec = { path = "crates/codec" }
crc32fast = "1"
crossbeam-channel = "0.5"
crossterm = "0.28"
dirs = "5"
fast_image_resize = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
libraw-rs = { path = "crates/libraw-rs" }
lru = "0.12"
pulp = "0.18"
quick-xml = "0.36"
ratatui = "0.29"
ratatui-image = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wide = "0.7"
