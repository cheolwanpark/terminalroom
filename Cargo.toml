[workspace]
members = [
    "crates/libraw-rs",
    "crates/terminalroom",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libraw-rs = { path = "crates/libraw-rs" }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
